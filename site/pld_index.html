<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive SPT — Forge local</title>
<style>
  :root {
    --bg: #12140f;
    --panel: #191c15;
    --panel-2: #1f231a;
    --border: #2c3024;
    --text: #d9d7c9;
    --muted: #8a8d7c;
    --accent: #c9a227;
    --accent-dim: #6b5c1c;
    --olive: #6b7a4f;
    --danger: #a5453a;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    --sans: Arial, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::selection { background: var(--accent-dim); color: var(--text); }

  header {
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
    font-weight: 700;
  }
  header .sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 0;
    min-height: calc(100vh - 53px);
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }

  aside {
    border-right: 1px solid var(--border);
    padding: 18px 16px;
    background: var(--panel);
  }
  .filter-group { margin-bottom: 22px; }
  .filter-group h3 {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 8px 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .filter-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 3px 0;
    cursor: pointer;
    color: var(--text);
  }
  .filter-group input[type="checkbox"] { accent-color: var(--accent); }
  select {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 8px;
    font-family: var(--sans);
    font-size: 13px;
    border-radius: 2px;
  }
  .count-badge {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    margin-left: auto;
  }

  main { padding: 18px 22px; }

  .searchbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .searchbar input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 14px;
    border-radius: 2px;
  }
  .searchbar input:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  .searchbar select { width: auto; min-width: 160px; }

  .result-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 14px;
    letter-spacing: 0.03em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.12s ease;
  }
  .card:hover { border-color: var(--accent-dim); }
  .card-thumb {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 2px;
    margin-bottom: 10px;
    background: var(--panel-2);
    display: block;
  }
  .card h3 {
    margin: 0 0 6px 0;
    font-size: 14px;
    color: var(--text);
    line-height: 1.3;
  }
  .card .teaser {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 30px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.03em;
  }
  .tag.version { border-color: var(--olive); color: var(--olive); }
  .tag.featured { border-color: var(--accent); color: var(--accent); }
  .tag.local { border-color: #4a7a4a; color: #7ab87a; }
  .tag.manual { border-color: var(--danger); color: #d98b80; }
  .card .stats {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  .empty {
    font-family: var(--mono);
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }

  /* Detail view */
  .detail { max-width: 820px; }
  .back-link {
    font-family: var(--mono);
    font-size: 12px;
    display: inline-block;
    margin-bottom: 16px;
  }
  .detail h2 {
    font-size: 22px;
    margin: 0 0 4px 0;
  }
  .detail .teaser-full { color: var(--muted); margin-bottom: 16px; font-size: 14px; }
  .detail-section {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 3px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .detail-section h4 {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin: 0 0 10px 0;
  }
  .desc-html { font-size: 14px; line-height: 1.6; }
  .desc-html img { max-width: 100%; }
  .desc-html a { word-break: break-word; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; font-size: 13px; }
  .kv dt { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .kv dd { margin: 0; }
  .version-row {
    border-top: 1px solid var(--border);
    padding: 10px 0;
    font-size: 13px;
  }
  .version-row:first-child { border-top: none; }
  .version-row .vhead {
    font-family: var(--mono);
    color: var(--accent);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
  }
  .version-row .vdesc { color: var(--muted); margin-top: 4px; white-space: pre-wrap; font-size: 12px; }
  .download-btn {
    display: inline-block;
    background: var(--accent-dim);
    color: var(--text);
    border: 1px solid var(--accent);
    padding: 8px 14px;
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 12px;
    text-decoration: none;
  }
  .download-btn:hover { background: var(--accent); color: #12140f; text-decoration: none; }
  .dl-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  .dl-row:first-child { border-top: none; padding-top: 0; }
  .dl-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .dl-note {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }
  .dl-note:first-child { border-top: none; }
  .warn-box {
    border: 1px solid var(--danger);
    color: #d98b80;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    border-radius: 2px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>&#9635; Archive SPT</h1>
  <span class="sub">Forge local — instantané hors ligne</span>
</header>

<div class="layout">
  <aside>
    <div class="filter-group">
      <h3>Catégorie</h3>
      <select id="categoryFilter"><option value="">Toutes</option></select>
    </div>
    <div class="filter-group">
      <h3>Version SPT</h3>
      <div id="versionFilters"></div>
    </div>
    <div class="filter-group">
      <h3>Affichage</h3>
      <label><input type="checkbox" id="showThumbnails" checked> Afficher les vignettes</label>
    </div>
    <div class="filter-group">
      <h3>Autres</h3>
      <label><input type="checkbox" id="onlyLocal"> Fichier présent en local</label>
      <label><input type="checkbox" id="onlyFeatured"> Featured uniquement</label>
    </div>
    <div class="filter-group">
      <h3>Tri</h3>
      <select id="sortBy">
        <option value="downloads">Téléchargements ▾</option>
        <option value="name">Nom (A-Z)</option>
        <option value="favourites">Favoris ▾</option>
      </select>
    </div>
  </aside>

  <main id="view">
    <div class="searchbar">
      <input type="text" id="searchInput" placeholder="Rechercher un mod par nom...">
    </div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
const state = {
  mods: [],
  categories: [],
  filtered: [],
  detailCache: {},
};

async function loadData() {
  const res = await fetch('../site_data.json');
  state.mods = await res.json();

  try {
    const catRes = await fetch('../categories.json');
    state.categories = await catRes.json();
  } catch (e) {
    console.warn('categories.json introuvable — lance spt_forge_categories.py pour avoir la liste complète.');
    state.categories = [];
  }

  populateFilters();
  render();
  window.addEventListener('hashchange', route);
  route();
}

function populateFilters() {
  const catSelect = document.getElementById('categoryFilter');

  // Compte local par slug de catégorie, pour afficher un nombre à côté de chaque option.
  const countsBySlug = {};
  let noCategoryCount = 0;
  state.mods.forEach(m => {
    if (m.category_slug) countsBySlug[m.category_slug] = (countsBySlug[m.category_slug] || 0) + 1;
    else noCategoryCount++;
  });

  // La liste des catégories vient de categories.json (liste officielle de Forge via
  // /mod-categories), pas de ce qui est présent localement — donc on voit toujours la
  // liste complète même si peu de mods téléchargés ont une catégorie donnée.
  const sortedCategories = [...state.categories].sort((a, b) => a.title.localeCompare(b.title));
  sortedCategories.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.slug;
    const count = countsBySlug[c.slug] || 0;
    opt.textContent = `${c.title} (${count})`;
    catSelect.appendChild(opt);
  });

  if (noCategoryCount > 0) {
    const opt = document.createElement('option');
    opt.value = '__none__';
    opt.textContent = `Sans catégorie (${noCategoryCount})`;
    catSelect.appendChild(opt);
  }

  const versions = [...new Set(state.mods.flatMap(m => m.matched_spt_versions || []))].sort();
  const vDiv = document.getElementById('versionFilters');
  versions.forEach(v => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" value="${v}" class="versionCheck"> ${v}`;
    vDiv.appendChild(label);
  });

  ['categoryFilter', 'sortBy'].forEach(id =>
    document.getElementById(id).addEventListener('change', applyFilters));
  ['onlyLocal', 'onlyFeatured'].forEach(id =>
    document.getElementById(id).addEventListener('change', applyFilters));
  document.getElementById('showThumbnails').addEventListener('change', renderGrid);
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.addEventListener('change', e => {
    if (e.target.classList.contains('versionCheck')) applyFilters();
  });
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const onlyLocal = document.getElementById('onlyLocal').checked;
  const onlyFeatured = document.getElementById('onlyFeatured').checked;
  const sortBy = document.getElementById('sortBy').value;
  const checkedVersions = [...document.querySelectorAll('.versionCheck:checked')].map(c => c.value);

  let list = state.mods.filter(m => {
    if (q && !(m.name || '').toLowerCase().includes(q) && !(m.teaser || '').toLowerCase().includes(q)) return false;
    if (cat === '__none__' && m.category_slug) return false;
    if (cat && cat !== '__none__' && m.category_slug !== cat) return false;
    if (onlyLocal && !m.has_local_file) return false;
    if (onlyFeatured && !m.featured) return false;
    if (checkedVersions.length && !checkedVersions.some(v => (m.matched_spt_versions || []).includes(v))) return false;
    return true;
  });

  if (sortBy === 'downloads') list.sort((a, b) => b.downloads - a.downloads);
  else if (sortBy === 'favourites') list.sort((a, b) => b.favourites_count - a.favourites_count);
  else list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  state.filtered = list;
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const meta = document.getElementById('resultMeta');
  meta.textContent = `${state.filtered.length} / ${state.mods.length} mods`;

  if (!state.filtered.length) {
    grid.innerHTML = '<div class="empty">Aucun résultat</div>';
    return;
  }

  const showThumbs = document.getElementById('showThumbnails').checked;

  grid.innerHTML = state.filtered.map(m => `
    <div class="card" onclick="location.hash='#/mod/${m.id}'">
      ${(showThumbs && m.thumbnail_filename) ? `<img class="card-thumb" src="../mods/${m.id}/${encodeURIComponent(m.thumbnail_filename)}" alt="" loading="lazy">` : ''}
      <h3>${escapeHtml(m.name || '(sans nom)')}</h3>
      <div class="teaser">${escapeHtml(m.teaser || '')}</div>
      <div class="tags">
        ${m.featured ? '<span class="tag featured">FEATURED</span>' : ''}
        ${(m.matched_spt_versions || []).map(v => `<span class="tag version">${v}</span>`).join('')}
        ${m.has_local_file ? '<span class="tag local">FICHIER LOCAL</span>' : ''}
        ${m.needs_manual_download ? '<span class="tag manual">DL MANUEL</span>' : ''}
      </div>
      <div class="stats">
        <span>&#8595; ${formatNum(m.downloads)}</span>
        <span>&#9733; ${formatNum(m.favourites_count)}</span>
      </div>
    </div>
  `).join('');
}

function render() { applyFilters(); }

function formatNum(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(n);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// --- Routing / detail view ---
async function route() {
  const hash = location.hash;
  const match = hash.match(/^#\/mod\/(\d+)/);
  if (match) {
    await showDetail(parseInt(match[1], 10));
  } else {
    showList();
  }
}

function showList() {
  document.querySelector('.layout').style.display = 'grid';
  document.getElementById('view').innerHTML = `
    <div class="searchbar"><input type="text" id="searchInput" placeholder="Rechercher un mod par nom..."></div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="grid" id="grid"></div>
  `;
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  renderGrid();
}

async function showDetail(id) {
  const view = document.getElementById('view');
  view.innerHTML = '<div class="empty">Chargement...</div>';

  let payload = state.detailCache[id];
  if (!payload) {
    try {
      const res = await fetch(`../mods/${id}/mod.json`);
      payload = await res.json();
      state.detailCache[id] = payload;
    } catch (e) {
      view.innerHTML = '<div class="empty">Impossible de charger ce mod.</div>';
      return;
    }
  }

  const mod = payload.mod?.data || {};
  const versions = payload.all_versions || [];
  const addons = payload.addons || [];
  const download = payload.download || {};

  const sourceLinks = (mod.source_code_links || [])
    .map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label || l.url}</a>`)
    .join('<br>') || '<span style="color:var(--muted)">—</span>';

  const authors = [mod.owner?.name, ...(mod.additional_authors || []).map(a => a.name)]
    .filter(Boolean).join(', ');

  let downloadBlock = '';

  // Fichier principal : la dernière version publiée toutes cibles confondues. On ne peut
  // PAS garantir qu'il s'agit de la 4.1 (le nom du fichier ne le dit pas forcément — seul
  // le fallback 4.0 ci-dessous a un nom explicite avec "-spt40").
  if (download.needs_manual) {
    downloadBlock += `<div class="warn-box">Fichier principal — téléchargement manuel requis (page d'atterrissage externe).<br>
      <a href="${download.external_url}" target="_blank" rel="noopener">${download.external_url}</a></div>`;
  } else if (download.success && download.path) {
    const filename = download.path.split(/[\\/]/).pop();
    downloadBlock += `<div class="dl-row">
      <span class="dl-label">Fichier principal (dernière version publiée)</span>
      <a class="download-btn" href="../mods/${id}/${encodeURIComponent(filename)}" download>&#8595; ${filename}</a>
    </div>`;
  } else {
    downloadBlock += '<div class="dl-note">Aucun fichier local sauvegardé pour ce mod.</div>';
  }

  // Fallback SPT 4.0, si fetch_40_fallback.py a été lancé pour ce mod.
  const d40 = payload.download_40;
  if (d40) {
    if (d40.found === false) {
      downloadBlock += `<div class="dl-note">Pas de version compatible SPT 4.0 trouvée dans l'historique de ce mod.</div>`;
    } else if (d40.same_as_primary_download) {
      downloadBlock += `<div class="dl-note">Le fichier principal ci-dessus est déjà la version SPT 4.0 (v${escapeHtml(d40.version || '')}) — pas de fichier séparé nécessaire.</div>`;
    } else if (d40.needs_manual) {
      downloadBlock += `<div class="warn-box">Version SPT 4.0 (v${escapeHtml(d40.version || '')}) — téléchargement manuel requis.<br>
        <a href="${d40.external_url}" target="_blank" rel="noopener">${d40.external_url}</a></div>`;
    } else if (d40.success && d40.path) {
      const filename40 = d40.path.split(/[\\/]/).pop();
      downloadBlock += `<div class="dl-row">
        <span class="dl-label">Fichier SPT 4.0 — v${escapeHtml(d40.version || '')}</span>
        <a class="download-btn" href="../mods/${id}/${encodeURIComponent(filename40)}" download>&#8595; ${filename40}</a>
      </div>`;
    } else {
      downloadBlock += `<div class="dl-note">Échec du téléchargement de la version 4.0 (${escapeHtml(d40.error || 'raison inconnue')}).</div>`;
    }
  }

  view.innerHTML = `
    <div class="detail">
      <a class="back-link" href="#/">&larr; retour à la liste</a>
      <h2>${escapeHtml(mod.name || '')}</h2>
      <div class="teaser-full">${escapeHtml(mod.teaser || '')}</div>

      <div class="detail-section">
        <h4>Téléchargement</h4>
        ${downloadBlock}
      </div>

      <div class="detail-section">
        <h4>Description</h4>
        <div class="desc-html">${mod.description || '<em>Pas de description.</em>'}</div>
      </div>

      <div class="detail-section">
        <h4>Détails</h4>
        <dl class="kv">
          <dt>Auteur(s)</dt><dd>${escapeHtml(authors || '—')}</dd>
          <dt>Catégorie</dt><dd>${escapeHtml(mod.category?.name || '—')}</dd>
          <dt>Licence</dt><dd>${escapeHtml(mod.license?.name || '—')}</dd>
          <dt>GUID</dt><dd style="font-family:var(--mono); font-size:12px;">${escapeHtml(mod.guid || '—')}</dd>
          <dt>Code source</dt><dd>${sourceLinks}</dd>
          <dt>Téléchargements</dt><dd>${formatNum(mod.downloads)}</dd>
          <dt>Favoris</dt><dd>${formatNum(mod.favourites_count)}</dd>
        </dl>
      </div>

      <div class="detail-section">
        <h4>Versions (${versions.length})</h4>
        ${versions.map(v => `
          <div class="version-row">
            <div class="vhead">
              <span>${escapeHtml(v.version)} ${v.spt_version_constraint ? '· ' + escapeHtml(v.spt_version_constraint) : ''}</span>
              <span>${v.published_at ? v.published_at.split('T')[0] : ''}</span>
            </div>
            ${v.description ? `<div class="vdesc">${escapeHtml(v.description)}</div>` : ''}
          </div>
        `).join('') || '<span style="color:var(--muted)">Aucune version.</span>'}
      </div>

      ${addons.length ? `
      <div class="detail-section">
        <h4>Addons (${addons.length})</h4>
        ${addons.map(a => `<div class="version-row"><div class="vhead"><span>${escapeHtml(a.name)}</span></div></div>`).join('')}
      </div>` : ''}
    </div>
  `;
}

loadData();
</script>
</body>
</html>
